server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: media-info-service
          uri: lb://MEDIA-INFO-SERVICE
          predicates:
            - Path=/api/v1/media/**
        - id: audio-service
          uri: lb://AUDIO-SERVICE
          predicates:
            - Path=/api/v1/audio/**
        - id: analytics-service
          uri: lb://ANALYTICS-SERVICE
          predicates:
            - Path=/api/v1/analytics/**

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
